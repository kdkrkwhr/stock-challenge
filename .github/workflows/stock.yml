name: Update stock data

on:
  schedule:
    # 평일 09~15시 KST ≈ UTC 00~06
    - cron: "*/10 0-6 * * 1-5"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Fetch stocks (all exchanges → data/*.json)
        run: python fetch_stocks.py
        timeout-minutes: 25

      - name: Commit stock shards
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add stock-data.json data/
          if git diff --cached --quiet; then
            echo "No changes — skip commit"
            exit 0
          fi
          git commit -m "chore: update full stock shards"
          git push
