<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#07090f" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <link rel="manifest" href="manifest.json" />
  <link rel="icon" href="icon-192.png" />
  <link rel="apple-touch-icon" href="icon-192.png" />
  <title>스톡챌린지</title>
  <link rel="preconnect" href="https://cdn.jsdelivr.net" />
  <link href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" rel="stylesheet" />
  <style>
    :root {
      --bg0: #07090f;
      --bg1: #0f1420;
      --panel: rgba(22, 28, 42, 0.85);
      --border: rgba(255, 255, 255, 0.08);
      --text: #f2f4f8;
      --muted: #8b95a8;
      --up: #ff4d6d;
      --down: #3d9eff;
      --accent: #00e5a8;
      --bar-track: rgba(255, 255, 255, 0.06);
      --nick: #c8d0e0;
      --surface: #121826;
      --input-bg: rgba(8, 12, 20, 0.7);
      --logo-bg: #1a2233;
    }
    [data-theme="light"] {
      --bg0: #eef1f7;
      --bg1: #e2e7f1;
      --panel: rgba(255, 255, 255, 0.92);
      --border: rgba(0, 0, 0, 0.1);
      --text: #11151f;
      --muted: #5a6578;
      --up: #e11d48;
      --down: #2563eb;
      --accent: #00a884;
      --bar-track: rgba(0, 0, 0, 0.08);
      --nick: #2a3346;
      --surface: #ffffff;
      --input-bg: rgba(0, 0, 0, 0.04);
      --logo-bg: #e7ebf3;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: "Pretendard", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
      background:
        radial-gradient(900px 500px at 85% -10%, rgba(0, 229, 168, 0.12), transparent 55%),
        radial-gradient(700px 400px at -5% 20%, rgba(61, 158, 255, 0.1), transparent 50%),
        linear-gradient(180deg, var(--bg1), var(--bg0));
      color: var(--text);
      min-height: 100vh;
    }
    header {
      max-width: 720px;
      margin: 0 auto;
      padding: 1.5rem 1.1rem 0.4rem;
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      gap: 1rem;
    }
    .brand h1 {
      margin: 0;
      font-size: 1.65rem;
      font-weight: 800;
      letter-spacing: -0.04em;
    }
    .brand .meta {
      color: var(--muted);
      font-size: 0.8rem;
      margin-top: 0.3rem;
    }
    .brand .meta .avg { font-weight: 700; margin-left: 0.4rem; }
    .avg.up { color: var(--up); }
    .avg.down { color: var(--down); }
    .avg.flat { color: var(--muted); }
    .nick-chip {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 999px;
      padding: 0.4rem 0.85rem;
      font-size: 0.85rem;
      color: var(--nick);
      cursor: pointer;
      backdrop-filter: blur(8px);
      white-space: nowrap;
    }
    .nick-chip:hover { border-color: var(--accent); color: var(--text); }
    main {
      max-width: 720px;
      margin: 0 auto;
      padding: 0.75rem 1.1rem 2.5rem;
    }
    .add-row {
      display: flex;
      gap: 0.5rem;
      position: relative;
      margin-bottom: 1.1rem;
    }
    .add-row input {
      flex: 1;
      background: var(--input-bg);
      border: 1px solid var(--border);
      color: var(--text);
      border-radius: 14px;
      padding: 0.85rem 1rem;
      font-size: 1rem;
    }
    .add-row input:focus {
      outline: none;
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(0, 229, 168, 0.15);
    }
    .dropdown {
      position: absolute;
      top: calc(100% + 6px);
      left: 0;
      right: 0;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 14px;
      max-height: 280px;
      overflow-y: auto;
      z-index: 30;
      display: none;
      box-shadow: 0 16px 40px rgba(0, 0, 0, 0.45);
    }
    .dropdown.open { display: block; }
    .dropdown button {
      display: flex;
      width: 100%;
      align-items: center;
      gap: 0.65rem;
      text-align: left;
      background: transparent;
      border: 0;
      color: var(--text);
      padding: 0.7rem 0.9rem;
      cursor: pointer;
      font-size: 0.95rem;
    }
    .dropdown button:hover,
    .dropdown button.active { background: rgba(255, 255, 255, 0.05); }
    .dropdown .logo {
      width: 28px;
      height: 28px;
      border-radius: 8px;
      background: #1a2233;
      object-fit: contain;
      flex-shrink: 0;
    }
    .dropdown .sub {
      color: var(--muted);
      font-size: 0.75rem;
    }
    .rank-list {
      display: flex;
      flex-direction: column;
      gap: 0.65rem;
    }
    .rank-row {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 0.85rem 0.95rem 0.95rem;
      backdrop-filter: blur(10px);
      position: relative;
      animation: rise 0.35s ease both;
    }
    @keyframes rise {
      from { opacity: 0; transform: translateY(8px); }
      to { opacity: 1; transform: none; }
    }
    .rank-top {
      display: flex;
      align-items: center;
      gap: 0.7rem;
      margin-bottom: 0.55rem;
    }
    .rank-num {
      width: 1.6rem;
      text-align: center;
      font-weight: 800;
      font-size: 0.95rem;
      color: var(--muted);
      font-variant-numeric: tabular-nums;
    }
    .rank-num.top3 { color: var(--accent); }
    .rank-logo {
      width: 36px;
      height: 36px;
      border-radius: 10px;
      background: var(--logo-bg);
      object-fit: contain;
      flex-shrink: 0;
    }
    .rank-logo.fallback {
      display: grid;
      place-items: center;
      font-size: 0.7rem;
      font-weight: 700;
      color: var(--muted);
    }
    .rank-info { flex: 1; min-width: 0; }
    .rank-info .name {
      font-weight: 700;
      font-size: 1.02rem;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .rank-info .meta-line {
      color: var(--muted);
      font-size: 0.75rem;
      margin-top: 0.1rem;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .rank-pct {
      font-weight: 800;
      font-size: 1.05rem;
      font-variant-numeric: tabular-nums;
      white-space: nowrap;
    }
    .rank-pct.up { color: var(--up); }
    .rank-pct.down { color: var(--down); }
    .rank-pct.flat { color: var(--muted); }
    .bar-track {
      height: 10px;
      border-radius: 999px;
      background: var(--bar-track);
      overflow: hidden;
      position: relative;
    }
    .bar-fill {
      height: 100%;
      border-radius: 999px;
      width: 0;
      transition: width 0.55s cubic-bezier(0.22, 1, 0.36, 1);
    }
    .bar-fill.up {
      background: linear-gradient(90deg, #ff7a8a, var(--up));
    }
    .bar-fill.down {
      background: linear-gradient(90deg, #7ab8ff, var(--down));
    }
    .bar-fill.flat { background: #5a6578; }
    .rank-foot {
      display: flex;
      justify-content: space-between;
      margin-top: 0.4rem;
      font-size: 0.78rem;
      color: var(--muted);
      font-variant-numeric: tabular-nums;
    }
    .rm {
      position: absolute;
      top: 0.45rem;
      right: 0.5rem;
      background: transparent;
      border: 0;
      color: var(--muted);
      cursor: pointer;
      font-size: 1.05rem;
      line-height: 1;
      padding: 0.2rem;
      opacity: 0.5;
    }
    .rm:hover { opacity: 1; color: var(--up); }
    .empty {
      color: var(--muted);
      text-align: center;
      padding: 3.2rem 1rem;
      border: 1px dashed var(--border);
      border-radius: 16px;
    }
    .gate {
      position: fixed;
      inset: 0;
      background: rgba(4, 6, 12, 0.78);
      backdrop-filter: blur(12px);
      display: grid;
      place-items: center;
      z-index: 100;
      padding: 1rem;
    }
    .gate.hidden { display: none; }
    .gate-card {
      width: min(400px, 100%);
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 1.6rem 1.35rem 1.35rem;
      box-shadow: 0 24px 60px rgba(0, 0, 0, 0.5);
    }
    .gate-card h2 {
      margin: 0 0 0.35rem;
      font-size: 1.35rem;
      letter-spacing: -0.03em;
    }
    .gate-card p {
      margin: 0 0 1.1rem;
      color: var(--muted);
      font-size: 0.9rem;
      line-height: 1.45;
    }
    .gate-card input {
      width: 100%;
      background: #0a0e16;
      border: 1px solid var(--border);
      color: var(--text);
      border-radius: 12px;
      padding: 0.85rem 1rem;
      font-size: 1.05rem;
      margin-bottom: 0.75rem;
    }
    .gate-card input:focus {
      outline: none;
      border-color: var(--accent);
    }
    .gate-card button {
      width: 100%;
      border: 0;
      border-radius: 12px;
      padding: 0.85rem;
      font-size: 1rem;
      font-weight: 700;
      background: var(--accent);
      color: #04140f;
      cursor: pointer;
    }
    .gate-card button:hover { filter: brightness(1.08); }
    .err {
      color: #e3b341;
      font-size: 0.82rem;
      margin-top: 0.35rem;
    }
    .install-bar {
      display: none;
      align-items: center;
      justify-content: space-between;
      gap: 0.75rem;
      background: linear-gradient(135deg, rgba(0, 229, 168, 0.12), var(--panel));
      border: 1px solid rgba(0, 229, 168, 0.35);
      border-radius: 16px;
      padding: 0.85rem 1rem;
      margin-bottom: 1rem;
      backdrop-filter: blur(8px);
    }
    .install-bar.show { display: flex; }
    .install-bar .t { margin: 0; font-size: 0.92rem; font-weight: 700; }
    .install-bar .sub { margin: 0.2rem 0 0; color: var(--muted); font-size: 0.75rem; }
    .btn-install {
      border: 0;
      border-radius: 12px;
      padding: 0.55rem 0.9rem;
      font-weight: 800;
      font-size: 0.85rem;
      cursor: pointer;
      background: var(--accent);
      color: #04140f;
      white-space: nowrap;
      font-family: inherit;
    }
    .btn-install:hover { filter: brightness(1.08); }
    .btn-hide {
      background: transparent;
      border: 1px solid var(--border);
      color: var(--muted);
      border-radius: 10px;
      padding: 0.35rem 0.55rem;
      font-size: 0.72rem;
      cursor: pointer;
      font-family: inherit;
    }
    .tabs {
      display: flex;
      gap: 0.4rem;
      margin-bottom: 0.9rem;
    }
    .tab {
      flex: 1;
      background: var(--input-bg);
      border: 1px solid var(--border);
      color: var(--muted);
      border-radius: 12px;
      padding: 0.55rem;
      font-size: 0.9rem;
      font-weight: 700;
      cursor: pointer;
      font-family: inherit;
      transition: all 0.15s ease;
    }
    .tab.active {
      color: #04140f;
      background: var(--accent);
      border-color: var(--accent);
    }
    .offline-banner {
      display: none;
      align-items: center;
      gap: 0.5rem;
      background: rgba(227, 179, 65, 0.12);
      border: 1px solid rgba(227, 179, 65, 0.4);
      border-radius: 12px;
      padding: 0.6rem 0.9rem;
      margin-bottom: 0.9rem;
      color: #e3b341;
      font-size: 0.82rem;
    }
    .offline-banner.show { display: flex; }
    .update-banner {
      display: none;
      align-items: center;
      justify-content: space-between;
      gap: 0.75rem;
      background: linear-gradient(135deg, rgba(0, 229, 168, 0.14), var(--panel));
      border: 1px solid rgba(0, 229, 168, 0.4);
      border-radius: 12px;
      padding: 0.6rem 0.9rem;
      margin-bottom: 0.9rem;
      color: var(--accent);
      font-size: 0.82rem;
      font-weight: 700;
    }
    .update-banner.show { display: flex; }
    .btn-update {
      border: 0;
      border-radius: 10px;
      padding: 0.4rem 0.8rem;
      font-weight: 800;
      font-size: 0.78rem;
      cursor: pointer;
      background: var(--accent);
      color: #04140f;
      font-family: inherit;
      white-space: nowrap;
    }
    .btn-update:hover { filter: brightness(1.08); }
    .hl-bar {
      display: none;
      gap: 0.5rem;
      margin-bottom: 0.9rem;
      font-size: 0.82rem;
      font-weight: 700;
      font-variant-numeric: tabular-nums;
    }
    .hl-bar.show { display: flex; }
    .hl-bar span {
      flex: 1;
      border-radius: 12px;
      padding: 0.55rem 0.75rem;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .hl-up { background: rgba(255, 77, 109, 0.14); border: 1px solid rgba(255, 77, 109, 0.4); color: var(--up); }
    .hl-down { background: rgba(61, 158, 255, 0.14); border: 1px solid rgba(61, 158, 255, 0.4); color: var(--down); }
    .tag {
      font-size: 0.95rem;
      line-height: 1;
      margin-right: -0.2rem;
    }
    .share-bar {
      display: flex;
      gap: 0.5rem;
      align-items: center;
      margin-bottom: 0.85rem;
    }
    .share-btn {
      background: var(--input-bg);
      border: 1px solid var(--border);
      color: var(--text);
      border-radius: 12px;
      padding: 0.5rem 0.8rem;
      font-size: 0.82rem;
      font-weight: 700;
      cursor: pointer;
      font-family: inherit;
      white-space: nowrap;
    }
    .share-btn:hover { border-color: var(--accent); color: var(--text); }
    .share-btn.ghost { color: var(--muted); }
    .share-msg {
      color: var(--accent);
      font-size: 0.78rem;
      font-weight: 700;
    }
    .alert-badge {
      position: absolute;
      top: 0.45rem;
      left: 0.5rem;
      background: rgba(227, 179, 65, 0.18);
      border: 1px solid rgba(227, 179, 65, 0.5);
      color: #e3b341;
      border-radius: 8px;
      padding: 0.1rem 0.4rem;
      font-size: 0.68rem;
      font-weight: 800;
      z-index: 2;
    }
    .fav {
      background: transparent;
      border: 0;
      cursor: pointer;
      font-size: 1.15rem;
      line-height: 1;
      padding: 0.15rem 0.25rem;
      color: var(--muted);
      opacity: 0.55;
      transition: all 0.15s ease;
    }
    .fav.on { color: #ffd24a; opacity: 1; }
    .fav:hover { opacity: 1; }
  </style>
</head>
<body>
  <div class="gate" id="gate">
    <div class="gate-card">
      <h2>닉네임 정해</h2>
      <p>가입 없음. 이 기기에서만 쓰는 별명이야. 나중에 칩 누르면 바꿀 수 있음.</p>
      <input id="nickInput" type="text" maxlength="16" placeholder="예: 동동" autocomplete="nickname" />
      <button type="button" id="nickGo">시작</button>
    </div>
  </div>

  <header>
    <div class="brand">
      <h1>스톡챌린지</h1>
      <div class="meta"><span id="updated">데이터 로딩 중…</span><span id="avg" class="avg"></span></div>
    </div>
    <button type="button" class="nick-chip" id="nickChip" title="닉네임 변경">—</button>
    <button type="button" class="nick-chip" id="themeBtn" title="테마 전환 (다크/라이트)">🌙</button>
  </header>

  <main>
    <div class="install-bar" id="installBar">
      <div>
        <p class="t">크롬 앱으로 설치</p>
        <p class="sub" id="installHint">웹에선 다운로드 버튼으로 홈 화면에 깔 수 있음</p>
      </div>
      <div style="display:flex;gap:0.4rem;align-items:center">
        <button type="button" class="btn-hide" id="installDismiss">숨김</button>
        <button type="button" class="btn-install" id="btnInstall">다운로드</button>
      </div>
    </div>
    <div class="offline-banner" id="offlineBanner">📡 오프라인 — 마지막 저장 데이터 보임</div>
    <div class="update-banner" id="updateBanner"><span>🆕 새 버전 있음 — 새로고침하면 적용</span><button type="button" class="btn-update" id="btnUpdate">새로고침</button></div>
    <div class="add-row">
      <input id="q" type="search" placeholder="종목·회사명 검색 (테슬라, 삼성…)" autocomplete="off" />
      <div class="dropdown" id="dd"></div>
    </div>
    <div class="tabs" id="tabs">
      <button type="button" class="tab active" data-m="all">전체</button>
      <button type="button" class="tab" data-m="KR">KR</button>
      <button type="button" class="tab" data-m="US">US</button>
    </div>
    <div class="share-bar" id="shareBar">
      <button type="button" class="share-btn" id="btnCopy">📋 픽 공유(복사)</button>
      <button type="button" class="share-btn ghost" id="btnImport">⬇ 가져오기</button>
      <button type="button" class="share-btn ghost" id="btnTh">🔔 ±5%</button>
      <button type="button" class="share-btn ghost" id="btnSort">↕ 등락률순</button>
      <span class="share-msg" id="shareMsg"></span>
    </div>
    <div class="hl-bar" id="hl"></div>
    <div id="list" class="rank-list"></div>
  </main>

  <script>
    const LS_PICKS = "stock-challenge-picks";
    const LS_NICK = "stock-challenge-nick";
    const LS_INSTALL_HIDE = "stock-challenge-install-hide";
    const LS_THRESH = "stock-challenge-threshold";
    const LS_SORT = "stock-challenge-sort";
    const LS_FAV = "stock-challenge-favs";
    let favs = (() => {
      try { return new Set(JSON.parse(localStorage.getItem(LS_FAV) || "[]")); } catch { return new Set(); }
    })();
    function saveFavs() { localStorage.setItem(LS_FAV, JSON.stringify([...favs])); }
    const LS_THEME = "stock-challenge-theme";
    function applyTheme(t) {
      if (t === "light") document.documentElement.setAttribute("data-theme", "light");
      else document.documentElement.removeAttribute("data-theme");
      const b = document.getElementById("themeBtn");
      if (b) b.textContent = t === "light" ? "☀️" : "🌙";
    }
    let theme = localStorage.getItem(LS_THEME) || "dark";
    applyTheme(theme);
    document.getElementById("themeBtn").addEventListener("click", () => {
      theme = theme === "light" ? "dark" : "light";
      localStorage.setItem(LS_THEME, theme);
      applyTheme(theme);
    });
    function toggleFav(code) {
      if (favs.has(code)) favs.delete(code); else favs.add(code);
      saveFavs();
      render();
    }
    let data = { updated: null, stocks: {} };
    let picks = loadPicks();
    let nick = localStorage.getItem(LS_NICK) || "";
    let deferredInstallPrompt = null;
    let filterMarket = "all";
    let sortMode = localStorage.getItem(LS_SORT) || "pct";
    let threshold = parseFloat(localStorage.getItem(LS_THRESH));
    if (!Number.isFinite(threshold) || threshold <= 0) threshold = 5;

    function isStandalone() {
      return window.matchMedia("(display-mode: standalone)").matches
        || window.navigator.standalone === true;
    }
    function updateInstallUI() {
      const bar = document.getElementById("installBar");
      const hint = document.getElementById("installHint");
      if (isStandalone() || localStorage.getItem(LS_INSTALL_HIDE) === "1") {
        bar.classList.remove("show");
        return;
      }
      bar.classList.add("show");
      hint.textContent = deferredInstallPrompt
        ? "누르면 크롬 앱처럼 설치됨"
        : "크롬 주소창 ⊞ 설치 / 메뉴 → 앱 설치";
    }
    window.addEventListener("beforeinstallprompt", (e) => {
      e.preventDefault();
      deferredInstallPrompt = e;
      updateInstallUI();
    });
    window.addEventListener("appinstalled", () => {
      deferredInstallPrompt = null;
      updateInstallUI();
    });
    document.getElementById("btnInstall").addEventListener("click", async () => {
      if (deferredInstallPrompt) {
        deferredInstallPrompt.prompt();
        await deferredInstallPrompt.userChoice;
        deferredInstallPrompt = null;
        updateInstallUI();
        return;
      }
      alert("크롬에서 주소창 오른쪽 설치 아이콘(또는 메뉴 → 앱 설치) 눌러봐");
    });
    document.getElementById("installDismiss").addEventListener("click", () => {
      localStorage.setItem(LS_INSTALL_HIDE, "1");
      updateInstallUI();
    });
    updateInstallUI();

    function updateOnlineUI() {
      document.getElementById("offlineBanner").classList.toggle("show", !navigator.onLine);
    }
    window.addEventListener("online", updateOnlineUI);
    window.addEventListener("offline", updateOnlineUI);
    updateOnlineUI();

    if ("serviceWorker" in navigator) {
      navigator.serviceWorker.register("./sw.js").then((reg) => {
        const showUpdate = () => {
          document.getElementById("updateBanner").classList.add("show");
          document.getElementById("btnUpdate").addEventListener("click", () => {
            if (reg.waiting) reg.waiting.postMessage({ type: "SKIP_WAITING" });
            document.getElementById("updateBanner").classList.remove("show");
          });
        };
        if (reg.waiting && navigator.serviceWorker.controller) showUpdate();
        reg.addEventListener("updatefound", () => {
          const nw = reg.installing;
          if (!nw) return;
          nw.addEventListener("statechange", () => {
            if (nw.state === "installed" && navigator.serviceWorker.controller) showUpdate();
          });
        });
      }).catch(() => {});
    }
    window.addEventListener("message", (e) => {
      if (e.data && e.data.type === "NEW_VERSION_READY") location.reload();
    });

    function loadPicks() {
      try {
        const raw = localStorage.getItem(LS_PICKS);
        const arr = raw ? JSON.parse(raw) : [];
        return Array.isArray(arr) ? arr : [];
      } catch {
        return [];
      }
    }
    function savePicks() {
      localStorage.setItem(LS_PICKS, JSON.stringify(picks));
    }

    const gate = document.getElementById("gate");
    const nickInput = document.getElementById("nickInput");
    const nickChip = document.getElementById("nickChip");

    function applyNick(name) {
      nick = (name || "").trim().slice(0, 16);
      if (!nick) return false;
      localStorage.setItem(LS_NICK, nick);
      nickChip.textContent = nick;
      gate.classList.add("hidden");
      return true;
    }
    function showGate(prefill) {
      gate.classList.remove("hidden");
      nickInput.value = prefill || nick || "";
      setTimeout(() => nickInput.focus(), 50);
    }
    if (nick) applyNick(nick);
    else showGate();

    document.getElementById("nickGo").addEventListener("click", () => {
      if (!applyNick(nickInput.value)) nickInput.focus();
    });
    nickInput.addEventListener("keydown", (e) => {
      if (e.key === "Enter") document.getElementById("nickGo").click();
    });
    nickChip.addEventListener("click", () => showGate(nick));

    function fmtPrice(n, currency) {
      if (n == null) return "—";
      const v = Number(n);
      if (currency === "USD") {
        return "$" + v.toLocaleString("en-US", { minimumFractionDigits: 2, maximumFractionDigits: 2 });
      }
      return Math.round(v).toLocaleString("ko-KR") + "원";
    }
    function fmtPct(n) {
      if (n == null) return "—";
      const v = Number(n);
      const sign = v > 0 ? "+" : "";
      return sign + v.toFixed(2) + "%";
    }

    async function fetchData() {
      const bust = "?t=" + Date.now();
      const res = await fetch("stock-data.json" + bust, { cache: "no-store" });
      if (!res.ok) throw new Error("HTTP " + res.status);
      const manifest = await res.json();
      const shards = Array.isArray(manifest.shards) ? manifest.shards : [];
      let stocks = { ...(manifest.stocks || {}) };

      if (shards.length) {
        const parts = await Promise.all(
          shards.map(async (s) => {
            const path = typeof s === "string" ? s : s.path;
            const r = await fetch(path + bust, { cache: "no-store" });
            if (!r.ok) throw new Error(path + " HTTP " + r.status);
            return r.json();
          })
        );
        for (const part of parts) {
          Object.assign(stocks, part.stocks || {});
        }
      }

      data = {
        updated: manifest.updated,
        count: Object.keys(stocks).length,
        stocks,
      };
      const el = document.getElementById("updated");
      const n = data.count;
      el.textContent = data.updated
        ? "업데이트 " + data.updated + " · " + n.toLocaleString("ko-KR") + "종목"
        : "업데이트 시각 없음";
      render();
    }

    function catalog() {
      return Object.entries(data.stocks || {}).map(([code, row]) => ({
        code,
        name: row.name || code,
        name_eng: row.name_eng || "",
        market: row.market || "",
        industry: row.industry || "",
        logo: row.logo || "",
        symbol: row.symbol || code,
      }));
    }

    function search(q) {
      q = (q || "").trim().toLowerCase();
      if (!q) return [];
      return catalog()
        .filter((s) =>
          s.code.toLowerCase().includes(q) ||
          s.symbol.toLowerCase().includes(q) ||
          s.name.toLowerCase().includes(q) ||
          (s.name_eng && s.name_eng.toLowerCase().includes(q)) ||
          (s.industry && s.industry.toLowerCase().includes(q))
        )
        .slice(0, 12);
    }

    const input = document.getElementById("q");
    const dd = document.getElementById("dd");
    let activeIdx = -1;

    function showDd(items) {
      dd.innerHTML = "";
      activeIdx = -1;
      if (!items.length) {
        dd.classList.remove("open");
        return;
      }
      items.forEach((s) => {
        const b = document.createElement("button");
        b.type = "button";
        const logoHtml = s.logo
          ? '<img class="logo" alt="" src="' + s.logo + '" />'
          : '<span class="logo" style="display:grid;place-items:center;font-size:0.65rem">' +
            (s.market || "?") +
            "</span>";
        b.innerHTML =
          logoHtml +
          "<span><div></div><div class=\"sub\"></div></span>";
        b.querySelector("div").textContent = s.name + " (" + s.symbol + ")";
        b.querySelector(".sub").textContent =
          [s.market, s.industry, s.name_eng].filter(Boolean).join(" · ");
        b.addEventListener("mousedown", (e) => {
          e.preventDefault();
          addPick(s.code);
        });
        dd.appendChild(b);
      });
      dd.classList.add("open");
    }

    input.addEventListener("input", () => showDd(search(input.value)));
    input.addEventListener("keydown", (e) => {
      const buttons = [...dd.querySelectorAll("button")];
      if (e.key === "ArrowDown" && buttons.length) {
        e.preventDefault();
        activeIdx = Math.min(activeIdx + 1, buttons.length - 1);
        buttons.forEach((b, i) => b.classList.toggle("active", i === activeIdx));
      } else if (e.key === "ArrowUp" && buttons.length) {
        e.preventDefault();
        activeIdx = Math.max(activeIdx - 1, 0);
        buttons.forEach((b, i) => b.classList.toggle("active", i === activeIdx));
      } else if (e.key === "Enter") {
        e.preventDefault();
        if (activeIdx >= 0 && buttons[activeIdx]) {
          buttons[activeIdx].dispatchEvent(new Event("mousedown"));
        } else {
          const hits = search(input.value);
          if (hits.length === 1) addPick(hits[0].code);
        }
      } else if (e.key === "Escape") {
        dd.classList.remove("open");
      }
    });
    input.addEventListener("blur", () => setTimeout(() => dd.classList.remove("open"), 150));

    const tabBar = document.getElementById("tabs");
    tabBar.addEventListener("click", (e) => {
      const btn = e.target.closest(".tab");
      if (!btn) return;
      filterMarket = btn.dataset.m;
      [...tabBar.querySelectorAll(".tab")].forEach((t) => t.classList.toggle("active", t === btn));
      render();
    });

    function addPick(code) {
      if (!picks.includes(code)) {
        picks.push(code);
        savePicks();
      }
      input.value = "";
      dd.classList.remove("open");
      render();
    }
    function removePick(code) {
      picks = picks.filter((c) => c !== code);
      savePicks();
      render();
    }

    function updateAvg() {
      const el = document.getElementById("avg");
      if (!picks.length) { el.textContent = ""; return; }
      const vals = picks
        .map((c) => {
          const r = (data.stocks || {})[c];
          return r && Number.isFinite(r.change_pct) ? r.change_pct : null;
        })
        .filter((v) => v !== null);
      if (!vals.length) { el.textContent = ""; return; }
      const avg = vals.reduce((a, b) => a + b, 0) / vals.length;
      let cls = "flat";
      if (avg > 0) cls = "up";
      else if (avg < 0) cls = "down";
      el.className = "avg " + cls;
      el.textContent = "평균 " + fmtPct(avg);
    }

    function render() {
      const list = document.getElementById("list");
      list.innerHTML = "";
      if (!picks.length) {
        list.innerHTML = '<div class="empty">종목 검색해서 픽 추가하면 등락 랭킹바로 뜸</div>';
        return;
      }

      const rows = picks
        .map((code) => {
          const row = (data.stocks && data.stocks[code]) || {
            name: code,
            error: "데이터 없음",
            change_pct: null,
          };
          return { code, row, pct: row.change_pct == null ? -Infinity : Number(row.change_pct) };
        })
        .filter(({ row }) => filterMarket === "all" || (row.market || "") === filterMarket);

      if (!rows.length) {
        list.innerHTML =
          '<div class="empty">' +
          (filterMarket === "all"
            ? "픽 없음"
            : filterMarket + " 시장에 픽 없음") +
          "</div>";
        return;
      }
      const favRank = (c) => (favs.has(c) ? 0 : 1);
      if (sortMode === "order") {
        const oi = (c) => picks.indexOf(c);
        rows.sort((a, b) => favRank(a.code) - favRank(b.code) || oi(a.code) - oi(b.code));
      } else {
        const pv = (r) => (Number.isFinite(r.pct) ? r.pct : -Infinity);
        rows.sort((a, b) => favRank(a.code) - favRank(b.code) || pv(b) - pv(a));
      }

      const finite = rows.filter((r) => Number.isFinite(r.pct)).map((r) => Math.abs(r.pct));
      const maxAbs = Math.max(1, ...finite);

      let bestIdx = -1, worstIdx = -1, bestP = -Infinity, worstP = Infinity;
      rows.forEach((r, i) => {
        if (!Number.isFinite(r.pct)) return;
        if (r.pct > bestP) { bestP = r.pct; bestIdx = i; }
        if (r.pct < worstP) { worstP = r.pct; worstIdx = i; }
      });
      const hl = document.getElementById("hl");
      if (bestIdx >= 0 && worstIdx >= 0) {
        hl.innerHTML =
          '<span class="hl-up">🚀 ' + rows[bestIdx].row.name + " " + fmtPct(rows[bestIdx].row.change_pct) + "</span>" +
          '<span class="hl-down">🔻 ' + rows[worstIdx].row.name + " " + fmtPct(rows[worstIdx].row.change_pct) + "</span>";
        hl.classList.add("show");
      } else {
        hl.classList.remove("show");
      }

      rows.forEach((item, i) => {
        const { code, row, pct } = item;
        const el = document.createElement("article");
        el.className = "rank-row";
        el.style.animationDelay = i * 0.04 + "s";

        let chgClass = "flat";
        if (pct > 0) chgClass = "up";
        else if (pct < 0 && Number.isFinite(pct)) chgClass = "down";

        const widthPct = Number.isFinite(pct)
          ? Math.max(6, Math.round((Math.abs(pct) / maxAbs) * 100))
          : 6;

        const metaBits = [
          row.market,
          row.exchange,
          row.industry,
          row.name_eng,
        ].filter(Boolean);

        const logo = row.logo
          ? '<img class="rank-logo" alt="" src="' + row.logo + '" />'
          : '<div class="rank-logo fallback">' + (row.market || "?") + "</div>";

        el.innerHTML =
          '<button class="rm" title="삭제" aria-label="삭제">×</button>' +
          '<div class="rank-top">' +
          '<button type="button" class="fav' + (favs.has(code) ? " on" : "") + '" title="즐겨찾기">★</button>' +
          '<div class="rank-num' + (i < 3 ? " top3" : "") + '">' + (i + 1) + "</div>" +
          '<span class="tag"></span>' +
          logo +
          '<div class="rank-info"><div class="name"></div><div class="meta-line"></div></div>' +
          '<div class="rank-pct ' + chgClass + '"></div>' +
          "</div>" +
          (row.error
            ? '<div class="err"></div>'
            : '<div class="bar-track"><div class="bar-fill ' +
              chgClass +
              '"></div></div>' +
              '<div class="rank-foot"><span class="price"></span><span class="sym"></span></div>');

        el.querySelector(".name").textContent = row.name || code;
        el.querySelector(".meta-line").textContent = metaBits.join(" · ") || code;
        el.querySelector(".rm").addEventListener("click", () => removePick(code));
        el.querySelector(".fav").addEventListener("click", (e) => { e.stopPropagation(); toggleFav(code); });

        const tag = el.querySelector(".tag");
        if (sortMode === "pct") {
          if (i === bestIdx) tag.textContent = "🚀";
          else if (i === worstIdx) tag.textContent = "🔻";
        }

        if (row.error) {
          el.querySelector(".err").textContent = row.error;
          el.querySelector(".rank-pct").textContent = "—";
        } else {
          el.querySelector(".rank-pct").textContent = fmtPct(row.change_pct);
          el.querySelector(".price").textContent = fmtPrice(row.price, row.currency);
          el.querySelector(".sym").textContent = (row.symbol || code) + (row.currency ? " · " + row.currency : "");
          const fill = el.querySelector(".bar-fill");
          requestAnimationFrame(() => {
            fill.style.width = widthPct + "%";
          });
        }
        if (threshold > 0 && Number.isFinite(pct) && Math.abs(pct) >= threshold) {
          const badge = document.createElement("div");
          badge.className = "alert-badge";
          badge.textContent = "🔔 " + (pct > 0 ? "+" : "") + pct.toFixed(1) + "%";
          el.appendChild(badge);
        }
        list.appendChild(el);
      });
      updateAvg();
    }

    const btnCopy = document.getElementById("btnCopy");
    const btnImport = document.getElementById("btnImport");
    const shareMsg = document.getElementById("shareMsg");
    function shareCode() {
      return btoa(unescape(encodeURIComponent(JSON.stringify({ n: nick || "", p: picks }))));
    }
    btnCopy.addEventListener("click", async () => {
      const code = shareCode();
      try {
        await navigator.clipboard.writeText(code);
      } catch {
        prompt("이 코드 복사해서 친구한테 보내:", code);
      }
      shareMsg.textContent = "복사됨! 친구한테 붙여넣기 해";
      setTimeout(() => (shareMsg.textContent = ""), 2000);
    });
    btnImport.addEventListener("click", () => {
      const code = prompt("친구한테 받은 공유코드 붙여넣기:");
      if (!code) return;
      try {
        const obj = JSON.parse(decodeURIComponent(escape(atob(code.trim()))));
        const np = Array.isArray(obj.p) ? obj.p : [];
        const before = picks.length;
        np.forEach((c) => { if (!picks.includes(c)) picks.push(c); });
        savePicks();
        if (obj.n) {
          nick = String(obj.n).slice(0, 16);
          localStorage.setItem(LS_NICK, nick);
          nickChip.textContent = nick;
        }
        shareMsg.textContent = (picks.length - before) + "종목 추가됨";
        setTimeout(() => (shareMsg.textContent = ""), 2000);
        render();
      } catch {
        alert("코드 이상함 ㅋㅋ 다시 확인해");
      }
    });

    const btnTh = document.getElementById("btnTh");
    function updateThUI() { btnTh.textContent = "🔔 ±" + threshold + "%"; }
    updateThUI();
    const btnSort = document.getElementById("btnSort");
    function updateSortUI() { btnSort.textContent = sortMode === "order" ? "↕ 내순서" : "↕ 등락률순"; }
    updateSortUI();
    btnSort.addEventListener("click", () => {
      sortMode = sortMode === "pct" ? "order" : "pct";
      localStorage.setItem(LS_SORT, sortMode);
      updateSortUI();
      render();
    });
    btnTh.addEventListener("click", () => {
      const v = prompt("등락률 알림 임계치(%) — 이 값 넘으면 배지 뜸 (0 입력 시 끄기):", threshold);
      if (v === null) return;
      const n = parseFloat(v);
      threshold = Number.isFinite(n) && n > 0 ? n : 0;
      localStorage.setItem(LS_THRESH, String(threshold));
      updateThUI();
      render();
    });

    fetchData().catch((e) => {
      document.getElementById("updated").textContent = "데이터 로드 실패: " + e.message;
      render();
    });
    setInterval(() => {
      fetchData().catch(() => {});
    }, 30000);
  </script>
</body>
</html>
