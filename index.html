<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>스톡챌린지</title>
  <style>
    :root {
      --bg: #0e1117;
      --panel: #161b22;
      --border: #30363d;
      --text: #e6edf3;
      --muted: #8b949e;
      --up: #f85149;
      --down: #58a6ff;
      --accent: #3fb950;
      --input: #0d1117;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: "Pretendard", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
      background: radial-gradient(1200px 600px at 10% -10%, #1a2332 0%, var(--bg) 55%);
      color: var(--text);
      min-height: 100vh;
    }
    header {
      padding: 1.25rem 1rem 0.5rem;
      max-width: 960px;
      margin: 0 auto;
    }
    h1 {
      margin: 0;
      font-size: 1.5rem;
      letter-spacing: -0.02em;
    }
    .meta {
      color: var(--muted);
      font-size: 0.85rem;
      margin-top: 0.35rem;
    }
    main {
      max-width: 960px;
      margin: 0 auto;
      padding: 1rem;
    }
    .add-row {
      display: flex;
      gap: 0.5rem;
      position: relative;
      margin-bottom: 1rem;
    }
    .add-row input {
      flex: 1;
      background: var(--input);
      border: 1px solid var(--border);
      color: var(--text);
      border-radius: 8px;
      padding: 0.7rem 0.85rem;
      font-size: 1rem;
    }
    .add-row input:focus {
      outline: 1px solid var(--accent);
      border-color: var(--accent);
    }
    .dropdown {
      position: absolute;
      top: calc(100% + 4px);
      left: 0;
      right: 0;
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 8px;
      max-height: 240px;
      overflow-y: auto;
      z-index: 20;
      display: none;
    }
    .dropdown.open { display: block; }
    .dropdown button {
      display: block;
      width: 100%;
      text-align: left;
      background: transparent;
      border: 0;
      color: var(--text);
      padding: 0.65rem 0.85rem;
      cursor: pointer;
      font-size: 0.95rem;
    }
    .dropdown button:hover,
    .dropdown button.active { background: #21262d; }
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
      gap: 0.75rem;
    }
    .card {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 1rem;
      position: relative;
    }
    .card .name {
      font-weight: 700;
      font-size: 1.05rem;
    }
    .card .code {
      color: var(--muted);
      font-size: 0.8rem;
      margin-left: 0.35rem;
    }
    .card .price {
      font-size: 1.35rem;
      margin-top: 0.55rem;
      font-variant-numeric: tabular-nums;
    }
    .card .chg {
      margin-top: 0.25rem;
      font-weight: 600;
      font-variant-numeric: tabular-nums;
    }
    .card .chg.up { color: var(--up); }
    .card .chg.down { color: var(--down); }
    .card .chg.flat { color: var(--muted); }
    .card .err {
      color: #d29922;
      font-size: 0.85rem;
      margin-top: 0.5rem;
    }
    .card .rm {
      position: absolute;
      top: 0.55rem;
      right: 0.55rem;
      background: transparent;
      border: 0;
      color: var(--muted);
      cursor: pointer;
      font-size: 1.1rem;
      line-height: 1;
      padding: 0.25rem;
    }
    .card .rm:hover { color: var(--up); }
    .empty {
      color: var(--muted);
      text-align: center;
      padding: 3rem 1rem;
      border: 1px dashed var(--border);
      border-radius: 12px;
    }
    sparkline {
      display: block;
      margin-top: 0.75rem;
      height: 36px;
    }
    sparkline canvas { width: 100%; height: 36px; }
  </style>
</head>
<body>
  <header>
    <h1>스톡챌린지</h1>
    <div class="meta" id="updated">데이터 로딩 중…</div>
  </header>
  <main>
    <div class="add-row">
      <input id="q" type="search" placeholder="종목 코드 또는 이름 검색" autocomplete="off" />
      <div class="dropdown" id="dd"></div>
    </div>
    <div id="list" class="grid"></div>
  </main>
  <script>
    const LS_KEY = "stock-challenge-picks";
    const HISTORY_KEY = "stock-challenge-history";
    let data = { updated: null, stocks: {} };
    let picks = loadPicks();
    let history = loadHistory();

    function loadPicks() {
      try {
        const raw = localStorage.getItem(LS_KEY);
        const arr = raw ? JSON.parse(raw) : [];
        return Array.isArray(arr) ? arr : [];
      } catch {
        return [];
      }
    }
    function savePicks() {
      localStorage.setItem(LS_KEY, JSON.stringify(picks));
    }
    function loadHistory() {
      try {
        const raw = localStorage.getItem(HISTORY_KEY);
        const obj = raw ? JSON.parse(raw) : {};
        return obj && typeof obj === "object" ? obj : {};
      } catch {
        return {};
      }
    }
    function saveHistory() {
      localStorage.setItem(HISTORY_KEY, JSON.stringify(history));
    }

    function fmtPrice(n) {
      if (n == null) return "—";
      return Number(n).toLocaleString("ko-KR");
    }
    function fmtPct(n) {
      if (n == null) return "—";
      const v = Number(n);
      const sign = v > 0 ? "+" : "";
      return sign + v.toFixed(2) + "%";
    }

    async function fetchData() {
      const url = "stock-data.json?t=" + Date.now();
      const res = await fetch(url, { cache: "no-store" });
      if (!res.ok) throw new Error("HTTP " + res.status);
      data = await res.json();
      const el = document.getElementById("updated");
      el.textContent = data.updated
        ? "마지막 업데이트: " + data.updated
        : "업데이트 시각 없음";
      // sparkline history
      const stocks = data.stocks || {};
      for (const [code, row] of Object.entries(stocks)) {
        if (row.price == null) continue;
        if (!history[code]) history[code] = [];
        const arr = history[code];
        if (!arr.length || arr[arr.length - 1] !== row.price) {
          arr.push(row.price);
          if (arr.length > 24) arr.shift();
        }
      }
      saveHistory();
      render();
    }

    function catalog() {
      return Object.entries(data.stocks || {}).map(([code, row]) => ({
        code,
        name: row.name || code,
      }));
    }

    function search(q) {
      q = (q || "").trim().toLowerCase();
      if (!q) return [];
      return catalog()
        .filter(
          (s) =>
            s.code.includes(q) ||
            s.name.toLowerCase().includes(q)
        )
        .slice(0, 12);
    }

    const input = document.getElementById("q");
    const dd = document.getElementById("dd");
    let activeIdx = -1;

    function showDd(items) {
      dd.innerHTML = "";
      activeIdx = -1;
      if (!items.length) {
        dd.classList.remove("open");
        return;
      }
      items.forEach((s, i) => {
        const b = document.createElement("button");
        b.type = "button";
        b.textContent = s.name + " (" + s.code + ")";
        b.dataset.idx = String(i);
        b.addEventListener("mousedown", (e) => {
          e.preventDefault();
          addPick(s.code);
        });
        dd.appendChild(b);
      });
      dd.classList.add("open");
    }

    input.addEventListener("input", () => showDd(search(input.value)));
    input.addEventListener("keydown", (e) => {
      const buttons = [...dd.querySelectorAll("button")];
      if (e.key === "ArrowDown" && buttons.length) {
        e.preventDefault();
        activeIdx = Math.min(activeIdx + 1, buttons.length - 1);
        buttons.forEach((b, i) => b.classList.toggle("active", i === activeIdx));
      } else if (e.key === "ArrowUp" && buttons.length) {
        e.preventDefault();
        activeIdx = Math.max(activeIdx - 1, 0);
        buttons.forEach((b, i) => b.classList.toggle("active", i === activeIdx));
      } else if (e.key === "Enter") {
        e.preventDefault();
        if (activeIdx >= 0 && buttons[activeIdx]) {
          buttons[activeIdx].dispatchEvent(new Event("mousedown"));
        } else {
          const hits = search(input.value);
          if (hits.length === 1) addPick(hits[0].code);
          else if (/^\d{6}$/.test(input.value.trim())) addPick(input.value.trim());
        }
      } else if (e.key === "Escape") {
        dd.classList.remove("open");
      }
    });
    input.addEventListener("blur", () => setTimeout(() => dd.classList.remove("open"), 150));

    function addPick(code) {
      if (!picks.includes(code)) {
        picks.push(code);
        savePicks();
      }
      input.value = "";
      dd.classList.remove("open");
      render();
    }
    function removePick(code) {
      picks = picks.filter((c) => c !== code);
      savePicks();
      render();
    }

    function drawSpark(canvas, values, up) {
      const ctx = canvas.getContext("2d");
      const dpr = window.devicePixelRatio || 1;
      const w = canvas.clientWidth;
      const h = canvas.clientHeight;
      canvas.width = w * dpr;
      canvas.height = h * dpr;
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      ctx.clearRect(0, 0, w, h);
      if (!values || values.length < 2) return;
      const min = Math.min(...values);
      const max = Math.max(...values);
      const span = max - min || 1;
      ctx.beginPath();
      values.forEach((v, i) => {
        const x = (i / (values.length - 1)) * (w - 2) + 1;
        const y = h - 2 - ((v - min) / span) * (h - 4);
        if (i === 0) ctx.moveTo(x, y);
        else ctx.lineTo(x, y);
      });
      ctx.strokeStyle = up ? "#f85149" : "#58a6ff";
      ctx.lineWidth = 1.5;
      ctx.stroke();
    }

    function render() {
      const list = document.getElementById("list");
      list.innerHTML = "";
      if (!picks.length) {
        list.innerHTML = '<div class="empty">종목을 검색해서 내 픽에 추가해봐</div>';
        return;
      }
      picks.forEach((code) => {
        const row = (data.stocks && data.stocks[code]) || { name: code, error: "데이터 없음" };
        const card = document.createElement("article");
        card.className = "card";
        const pct = row.change_pct;
        let chgClass = "flat";
        let arrow = "";
        if (pct > 0) { chgClass = "up"; arrow = "▲ "; }
        else if (pct < 0) { chgClass = "down"; arrow = "▼ "; }
        card.innerHTML =
          '<button class="rm" title="삭제" aria-label="삭제">×</button>' +
          '<div><span class="name"></span><span class="code"></span></div>' +
          (row.error
            ? '<div class="err"></div>'
            : '<div class="price"></div><div class="chg"></div><sparkline><canvas></canvas></sparkline>');
        card.querySelector(".name").textContent = row.name || code;
        card.querySelector(".code").textContent = code;
        card.querySelector(".rm").addEventListener("click", () => removePick(code));
        if (row.error) {
          card.querySelector(".err").textContent = row.error;
        } else {
          card.querySelector(".price").textContent = fmtPrice(row.price) + "원";
          const chg = card.querySelector(".chg");
          chg.className = "chg " + chgClass;
          chg.textContent = arrow + fmtPct(pct);
          const canvas = card.querySelector("canvas");
          requestAnimationFrame(() =>
            drawSpark(canvas, history[code] || [row.price], pct >= 0)
          );
        }
        list.appendChild(card);
      });
    }

    fetchData().catch((e) => {
      document.getElementById("updated").textContent = "데이터 로드 실패: " + e.message;
      render();
    });
    setInterval(() => {
      fetchData().catch(() => {});
    }, 30000);
  </script>
</body>
</html>
